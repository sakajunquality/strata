name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The end-to-end tests drive the git client that the runner comes with.
      - run: cargo test --workspace --locked
      # The real binary: push, restart, clone.
      - run: cargo build --locked -p strata-server
      - run: scripts/smoke.sh

  # The server against what it runs on elsewhere, each in Docker: PostgreSQL,
  # the Cloud Spanner emulator, and an S3-compatible object store.
  backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            run: scripts/meta-test.sh postgres
          - name: spanner
            run: scripts/meta-test.sh spanner
          - name: s3
            run: scripts/s3-smoke.sh
    name: backends (${{ matrix.name }})
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: backends
      - run: cargo build --locked
      - run: ${{ matrix.run }}

  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/hub
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      # The hub's tests start the engine they find in target/debug.
      - run: cargo build --locked -p strata-server
        working-directory: .
      - run: bun test

  # What is shipped builds: the two images, and the Kubernetes example.
  # Nothing is pushed; the deploy workflow does that.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t strata .
      - run: docker run --rm strata --help
      - run: docker build -t strata-hub examples/hub
      - run: |
          kubectl kustomize examples/k8s/base >/dev/null
          kubectl kustomize examples/k8s/local >/dev/null
