# Publishes the server's image to ghcr.io/<owner>/strata, for amd64 and arm64.
# Run by hand, on main: Actions -> container -> Run workflow, with the version
# that Cargo.toml has (v0.1.0).
#
# Each platform is built on a runner of its own kind and tried there. The two
# are then joined into one index, which is attested, checked against that
# attestation, and only then given the version's tag. A version that is
# already published is never replaced; `sha-<commit>` names what was built
# from a commit, and moves if that commit is built again.
name: container

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, as Cargo.toml has it (v0.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: container-publication
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  VERSION: ${{ inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      amd64: ${{ steps.digest.outputs.amd64 }}
      arm64: ${{ steps.digest.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Only main, and only the version the source says it is
        run: |
          test "$GITHUB_REF" = refs/heads/main
          in_source="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ "$VERSION" = "$in_source" ] || { echo "::error::asked for $VERSION, but Cargo.toml says $in_source"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Only to stop early: before the first image there is no repository to
      # ask, so a lookup that fails is let through here. The one that decides
      # is made before the tag is given, and stops unless the answer is no.
      - name: Refuse to replace a published version
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION is already published"; exit 1
          fi
      - name: Build, and push by digest
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Try what was pushed
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: docker run --rm "$IMAGE@$DIGEST" --help >/dev/null
      - id: digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "${{ matrix.arch }}=$DIGEST" >> "$GITHUB_OUTPUT"

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Join the two platforms into one index
        id: index
        env:
          AMD64: ${{ needs.build.outputs.amd64 }}
          ARM64: ${{ needs.build.outputs.arm64 }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          candidate="$IMAGE:sha-${GITHUB_SHA::12}"
          docker buildx imagetools create -t "$candidate" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --annotation "index:org.opencontainers.image.description=A git engine with storage and compute separated" \
            "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          digest="$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "::error::no digest for $candidate"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Check the index against its attestation
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/container.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
      - name: Give the checked index its version, without building again
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          if found="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"; then
            echo "::error::$IMAGE:$VERSION is already published"; exit 1
          elif ! grep -qi "not found" <<<"$found"; then
            echo "::error::could not tell whether $IMAGE:$VERSION is published: $found"; exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          tagged="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          [ "$tagged" = "$DIGEST" ] || { echo "::error::$IMAGE:$VERSION is $tagged, not the checked $DIGEST"; exit 1; }
          echo "$IMAGE:$VERSION@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
