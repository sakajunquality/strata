# One pull request a week for each kind of dependency, rather than one each.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /examples/hub
    schedule:
      interval: weekly
    groups:
      bun:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/", "/examples/hub"]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
